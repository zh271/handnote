[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handnote"
version = "0.1.0"
description = "Render Markdown notes with a handwriting font, per-glyph jitter and hand-drawn math."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "zh271" }]
keywords = ["handwriting", "font-generation", "markdown", "mathtext", "opentype"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup",
  "Topic :: Multimedia :: Graphics :: Presentation",
]
dependencies = [
  "pillow>=10",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "fonttools>=4.50",
  "opencv-python-headless>=4.9",
]

[project.urls]
Homepage = "https://github.com/zh271/handnote"
Repository = "https://github.com/zh271/handnote"
Issues = "https://github.com/zh271/handnote/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
handnote = "handnote.cli:main"

[tool.setuptools.packages.find]
include = ["handnote*"]

[tool.setuptools.package-data]
handnote = ["webui/*.html", "webui/*.js", "webui/*.css"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
]
